# Render Blueprint: New -> Blueprint -> pick this repo. Creates the web service + Postgres.
# After the first deploy, set HF_TOKEN in the service's Environment tab.
services:
  - type: web
    name: noteplify
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noteplify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HF_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: MOCK_AI
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "200"

databases:
  - name: noteplify-db
    plan: free
    databaseName: noteplify
